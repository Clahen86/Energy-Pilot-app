# Builds the Android app (APK) and puts it on the release "android-latest", ready to install on the phone.
name: Android-app
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test kernen og driverne
        run: |
          pip install numpy scikit-learn
          python -m unittest discover tests

      - name: Kernen er den samme som i Home Assistant-appen
        run: |
          COMMIT=$(python -c "import json;print(json.load(open('CORE_SOURCE.json'))['commit'])")
          git clone -q https://github.com/Clahen86/Energy-pilot ha-core
          git -C ha-core checkout -q "$COMMIT"
          python tools/check_core.py ha-core
          rm -rf ha-core

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Python til appen (Pyodide)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/fetch_pyodide.py

      - name: Android-projekt
        run: |
          npm install
          npx cap add android
          python tools/patch_android.py
          npx cap sync android

      - name: Byg APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Læg APK'en på en udgivelse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Energipilot.apk
          VERSION=$(python -c "import json;print(json.load(open('CORE_SOURCE.json'))['version'])")
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Energipilot.apk --prerelease \
            --title "Energipilot til Android (seneste)" \
            --notes "Bygget fra ${GITHUB_SHA::7}, Energy Pilot-kerne ${VERSION}. Åbn siden på telefonen, hent Energipilot.apk og installér."

      - uses: actions/upload-artifact@v4
        with:
          name: Energipilot-apk
          path: Energipilot.apk
