<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080d">
<title>Energipilot</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>html,body{margin:0;background:#06080d}</style>
</head>
<body>
<script>
/* Energipilot starter: runs the newest version the app has - the one it came with (app.html), or a newer one it
   has fetched itself from GitHub Pages (js/bridge.js, "Automatisk opdatering"). ?ota=0 always uses app.html. */
(async function () {
  let bundled = null, ota = null, html = null;
  try { bundled = await (await fetch('version.json', { cache: 'no-store' })).json(); } catch (e) { /* */ }
  try { ota = JSON.parse(localStorage.getItem('ep_ota_meta') || 'null'); html = localStorage.getItem('ep_ota_html'); } catch (e) { /* */ }
  const off = /[?&]ota=0/.test(location.search);
  if (!off && ota && html && bundled && ota.built > bundled.built && ota.native === bundled.native) {
    window.EP_OTA = ota;
    document.open();
    document.write(html);
    document.close();
    return;
  }
  location.replace('app.html' + location.search + location.hash);
})();
</script>
</body>
</html>
